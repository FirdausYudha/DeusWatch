# nginx to serve the DeusWatch SPA + reverse-proxy the API.
# /api, /healthz, /readyz are forwarded to the `api` service (docker compose mode),
# so the UI hits the backend without CORS issues. The rest = SPA (history fallback).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve `api` per request via Docker's embedded DNS, so if the api container is
    # recreated (new IP) nginx doesn't keep proxying to a stale address and return 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8080;

    # ── Security headers ──────────────────────────────────────────────────────────
    # `always` so they are set on error responses too, which is where a sniffing or
    # framing attack is most likely to find something to work with.
    #
    # NOTE for whoever edits this file: an `add_header` inside a location block REPLACES
    # every inherited header rather than adding to it. If you add one to a location
    # below, repeat these there as well or that path silently loses all of them.

    # script-src without 'unsafe-inline' or 'unsafe-eval' is the whole point of this
    # policy. The built SPA has no inline script (one external module, same origin), so
    # nothing legitimate needs them, and injected script has nowhere to run.
    #
    # style-src DOES need 'unsafe-inline': React writes style attributes for dynamic
    # values (chart bar widths, gauges, the geo map). That weakens styling injection
    # only, not script execution.
    #
    # connect-src 'self' is safe because every backend call goes to /api on this origin.
    # The external links on the Settings and Inventory pages are navigations, which this
    # does not restrict, not resource loads. The geo map ships its geometry in the
    # bundle rather than fetching tiles, so no map host is needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Clickjacking. frame-ancestors above covers modern browsers; this covers the rest.
    add_header X-Frame-Options "DENY" always;

    # Stop the browser guessing a content type. A log line stored and served back as
    # text must never be sniffed into HTML.
    add_header X-Content-Type-Options "nosniff" always;

    # Specifically because two endpoints accept their token in the QUERY STRING: the
    # blocklist feed, which firewalls fetch and which usually cannot set a header, and
    # the ML API. Without this, following any external link from a page carrying such a
    # URL would hand that token to the destination in the Referer.
    add_header Referrer-Policy "no-referrer" always;

    # Nothing here uses a camera, microphone or geolocation, so deny them outright.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # HSTS is deliberately NOT set here. This server listens on plain HTTP and TLS is
    # terminated by the operator's own proxy, so this is the wrong place for it, and
    # HSTS is STICKY: a browser that once saw it will refuse plain HTTP to this host for
    # max-age, which locks an operator out of their own deployment. Set it on the proxy
    # that actually terminates TLS.

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # THIS MUST STAY ABOVE THE API'S OWN LLM BUDGET (llm.DefaultTimeout, 5m, overridable with
        # LLM_TIMEOUT). The AI report and the assistant each make one synchronous model call, and a
        # local 8B model on CPU can spend minutes reading a long prompt before it writes a word.
        #
        # Whichever timeout is shorter is the one the operator sees, so if nginx gives up first they
        # get this server's 504 HTML page instead of the API's JSON error: no reason, nothing
        # actionable, and raising LLM_TIMEOUT has no effect because it never gets that far. That is
        # exactly what happened when the API budget went from 120s to 5m and this was left at 180s.
        # Raise this first, and keep the gap, whenever that budget changes.
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
    location = /healthz { proxy_pass http://$api_upstream; }
    location = /readyz  { proxy_pass http://$api_upstream; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
