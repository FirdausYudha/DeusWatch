# MySQL authentication failure (error log).
#
# Lines this matches:
#   2026-10-07T10:00:00.123456Z 12 [Note] [MY-010926] [Server] Access denied for user 'root'@'203.0.113.9' (using password: YES)
#   2026-10-07 10:00:00 12 [Warning] Access denied for user 'app'@'203.0.113.9' (using password: NO)
#
# MySQL 8 logs "Access denied" at Note level, which is OFF by default. Without this it writes
# nothing at all for a failed login and there is no brute force to detect:
#
#   log_error_verbosity = 3
#
# The host half of 'user'@'host' is only captured when it is an IPv4 address. It is often
# "localhost" or a reverse-resolved name, and writing either into source.ip would put a value in a
# field the ban path reads as an address.
name: mysql-access-denied
dataset: mysql
category: authentication
outcome: failure
level: low
regex: "Access denied for user '(?P<user_name>[^']*)'@'(?:(?P<source_ip>\\d{1,3}(?:\\.\\d{1,3}){3})|[^']*)'"
