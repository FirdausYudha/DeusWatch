name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build, vet & test
    runs-on: ubuntu-latest
    # Services for integration tests (Postgres+TimescaleDB & NATS JetStream).
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: deuswatch
          POSTGRES_PASSWORD: deuswatch_dev
          POSTGRES_DB: deuswatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deuswatch -d deuswatch"
          --health-interval 5s --health-timeout 3s --health-retries 12
      nats:
        image: nats:2.10.22-alpine
        ports:
          - 4222:4222
    env:
      STORE_DSN: postgres://deuswatch:deuswatch_dev@localhost:5432/deuswatch?sslmode=disable
      DATABASE_URL: postgres://deuswatch:deuswatch_dev@localhost:5432/deuswatch?sslmode=disable
      NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned to a patched release. govulncheck reports stdlib advisories against the toolchain
          # that compiled the code, and '1.26' resolves to whatever setup-go has cached, which was
          # 1.26.4 and carried seven net/http, net/textproto and crypto/tls advisories.
          go-version: '1.26.9'
          cache: true
      # internal/malware links libyara through cgo (yara_scanner.go is //go:build cgo). The runner
      # defaults to CGO_ENABLED=1, so without the headers every step below fails at compile time,
      # which is what had the whole job red. Setting CGO_ENABLED=0 would pick the nocgo stub and
      # make it pass, but it would also silently stop testing the gateway: deploy/Dockerfile builds
      # that one with CGO_ENABLED=1 and yara-dev, so the stub is not what ships. It would also
      # break `go test -race`, which requires cgo.
      - name: install libyara (cgo dependency of internal/malware)
        run: sudo apt-get update && sudo apt-get install -y libyara-dev
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: migrate (apply schema for integration tests)
        run: go run ./cmd/migrate
      - name: test
        run: go test -race ./...

  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned to a patched release. govulncheck reports stdlib advisories against the toolchain
          # that compiled the code, and '1.26' resolves to whatever setup-go has cached, which was
          # 1.26.4 and carried seven net/http, net/textproto and crypto/tls advisories.
          go-version: '1.26.9'
          cache: true
      - name: install libyara (cgo dependency of internal/malware)
        run: sudo apt-get update && sudo apt-get install -y libyara-dev
      # Unpinned on purpose, unlike gosec: this one reports CVEs, and a stale scanner that misses a
      # new advisory fails the wrong way round. A red build here is meant to be news.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  gosec:
    name: Static security analysis (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned to a patched release. govulncheck reports stdlib advisories against the toolchain
          # that compiled the code, and '1.26' resolves to whatever setup-go has cached, which was
          # 1.26.4 and carried seven net/http, net/textproto and crypto/tls advisories.
          go-version: '1.26.9'
          cache: true
      - name: install libyara (cgo dependency of internal/malware)
        run: sudo apt-get update && sudo apt-get install -y libyara-dev
      # Pinned, not @latest. An unpinned linter turns CI red on days nobody touched the code,
      # because upstream shipped a new rule; a red build that nobody caused is a red build nobody
      # reads. Bump this deliberately and fix what the new rules find in that same commit.
      - name: install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
        # Excluded because they are inherent to this tool's domain (not vulnerabilities):
        #   G204 run nft/cscli/Get-WinEvent       G304 open log/config files per input
        #   G301/G306 cert/buffer file perms      G706 log operational data
        #   G115 bounded int conversion (severity 0..4, etc.)
        #   G703 path traversal: every site is a deployment path (GEOIP_DB_PATH, CERT_DIR) or a
        #        path this code built itself. Same category as G304 above.
        #   G704 SSRF: the flagged URLs come from env or an admin-configured integration, and
        #        "POST to the webhook the administrator chose" is the feature, not a bypass.
        #   G104 unhandled errors: best-effort Close and Write on paths that already failed.
        # Deliberately NOT excluded, so the rule keeps working on new code: G402 InsecureSkipVerify,
        # G302 file permissions, G118 context, G122 walk races. The few intended sites carry an
        # inline `#nosec <rule> -- reason` instead.
        # tools/ is developer utilities that take a path on the command line and never ship.
      - run: gosec -exclude-dir=web -exclude-dir=tools -exclude=G204,G304,G306,G301,G706,G115,G703,G704,G104 ./...

  web:
    name: Web build & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
